<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>允许使用麦克风</title>
<style>
  :root { --bg: #fff; --fg: #18181b; --muted: #71717a; --acc: #fb7299; }
  @media (prefers-color-scheme: dark) { :root { --bg: #18181b; --fg: #f4f4f5; --muted: #a1a1aa; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; padding: 16px; }
  main { max-width: 420px; text-align: center; }
  img { width: 64px; }
  h1 { font-size: 20px; margin: 12px 0 4px; }
  p { color: var(--muted); margin: 0 0 18px; }
  button { cursor: pointer; border: 0; border-radius: 10px; padding: 10px 22px; background: var(--acc); color: #fff;
    font-size: 15px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <img src="icons/128.png" alt="">
  <h1 id="title">允许「一起看」使用麦克风</h1>
  <p id="desc">语音通话需要麦克风权限。只需授权一次，声音通过 P2P 直接发给房间里的朋友。</p>
  <button id="grant">允许使用麦克风</button>
</main>
<script src="permission.js"></script>
</body>
</html>
